<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>시안 C · 바뀌는 한 단어</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
    <link rel="stylesheet" href="lab.css" />
    <style>
      html, body { background: #f3f1ec; color: #111; }
      .lab-nav, .lab-switch a { color: #555; }
      .lab-switch a { border-color: rgba(0, 0, 0, 0.15); }
      .lab-switch a[aria-current] { border-color: #111; color: #111; }
      .hero { position: relative; min-height: max(100svh, 640px); padding: 110px var(--gutter) 60px; display: grid; align-content: center; overflow: hidden; }
      .kicker { margin: 0 0 24px; font-size: 15px; color: #6b6b6b; }
      h1 { margin: 0; font-size: clamp(44px, 7.4vw, 120px); font-weight: 800; line-height: 1.08; letter-spacing: -0.045em; }
      .who { font-weight: 900; }
      .roll { display: inline-grid; height: 1.08em; overflow: hidden; vertical-align: bottom; color: var(--accent); }
      .roll span { grid-area: 1 / 1; transform: translateY(105%); transition: transform 0.7s cubic-bezier(0.7, 0, 0.2, 1); }
      .roll span.on { transform: none; }
      .roll span.off { transform: translateY(-105%); }
      .sub { margin: 40px 0 44px; display: flex; gap: 40px; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; }
      .roles { color: #555; }
      .roles span { color: var(--accent); }
      .actions { display: flex; gap: 10px; }
      .btn--ghost { border-color: rgba(0, 0, 0, 0.25); }
      .btn { will-change: transform; }
      .blob { position: absolute; width: 46vw; height: 46vw; right: -10vw; top: 8vh; border-radius: 50%; background: var(--accent); filter: blur(90px); opacity: 0.18; transition: transform 1.2s cubic-bezier(0.2, 0.7, 0.2, 1); pointer-events: none; }
    </style>
  </head>
  <body>
    <header class="lab-nav">
      <b>이재훈</b>
      <nav class="lab-switch"><a href="a.html">A</a><a href="b.html">B</a><a href="c.html" aria-current="page">C</a><a href="d.html">D</a></nav>
    </header>
    <section class="hero" id="hero">
      <div class="blob" id="blob" aria-hidden="true"></div>
      <h1>
        <b class="who">이재훈은</b><br />
        어려운 기술을<br />
        누구나 읽는
        <span class="roll" id="roll"><span class="on">이야기</span><span>뉴스레터</span><span>칼럼</span><span>책</span><span>강연</span></span>로<br />
        옮깁니다.
      </h1>
      <div class="sub">
        <ul class="roles">
          <li><span>지금</span>노타 Technical Content Manager</li>
          <li><span>발행</span>『테크잇슈』</li>
          <li><span>저서</span>『샘 올트먼, 더 비전 2030』</li>
          <li><span>강연</span>기업·학교 AI 강연</li>
        </ul>
        <div class="actions"><a class="btn btn--primary magnet" href="#">뉴스레터 구독</a><a class="btn btn--ghost magnet" href="#">강연·협업 문의</a></div>
      </div>
    </section>
    <script>
      // The rolling word cycles through the forms the work takes. Buttons lean toward the pointer.
      const words = [...document.querySelectorAll("#roll span")];
      const still = matchMedia("(prefers-reduced-motion: reduce)").matches;
      let i = 0;
      if (!still) setInterval(() => {
        const cur = words[i]; i = (i + 1) % words.length; const next = words[i];
        cur.className = "off"; next.className = "on";
        setTimeout(() => { cur.className = ""; }, 720);
      }, 2000);
      const blob = document.getElementById("blob");
      addEventListener("pointermove", e => {
        if (still) return;
        blob.style.transform = `translate(${(e.clientX / innerWidth - 0.7) * 30}vw, ${(e.clientY / innerHeight - 0.4) * 20}vh)`;
        document.querySelectorAll(".magnet").forEach(b => {
          const r = b.getBoundingClientRect(), dx = e.clientX - (r.left + r.width / 2), dy = e.clientY - (r.top + r.height / 2);
          const d = Math.hypot(dx, dy);
          b.style.transform = d < 120 ? `translate(${dx * 0.25}px, ${dy * 0.35}px)` : "";
        });
      });
    </script>
  </body>
</html>
