<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>시안 B · 손전등으로 비추는 이름</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
    <link rel="stylesheet" href="lab.css" />
    <style>
      .hero { position: relative; height: 100svh; min-height: 640px; overflow: hidden; --x: 50%; --y: 45%; }
      .layer { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: center; padding: 0 var(--gutter); }
      .name { margin: 0; font-size: clamp(90px, 21vw, 340px); font-weight: 900; line-height: 0.9; letter-spacing: -0.06em; }
      .under { margin: 28px 0 0; font-size: clamp(18px, 2.2vw, 30px); font-weight: 600; letter-spacing: -0.02em; }
      .dim .name { color: transparent; -webkit-text-stroke: 1px rgba(242, 242, 242, 0.16); }
      .dim .under { color: rgba(242, 242, 242, 0.14); }
      .lit { -webkit-mask-image: radial-gradient(circle 220px at var(--x) var(--y), #000 30%, transparent 75%); mask-image: radial-gradient(circle 220px at var(--x) var(--y), #000 30%, transparent 75%); }
      .lit .name { background: linear-gradient(100deg, #f2f2f2 30%, #6e96ff 70%); -webkit-background-clip: text; background-clip: text; color: transparent; }
      .lit .under em { font-style: normal; color: var(--accent-soft); }
      .bottom { position: absolute; left: var(--gutter); right: var(--gutter); bottom: 7vh; z-index: 2; display: flex; justify-content: space-between; align-items: flex-end; gap: 24px; flex-wrap: wrap; }
      .actions { display: flex; gap: 10px; }
      .glow { position: absolute; inset: 0; pointer-events: none; background: radial-gradient(circle 360px at var(--x) var(--y), rgba(39, 94, 254, 0.14), transparent 70%); }
    </style>
  </head>
  <body>
    <header class="lab-nav">
      <b>이재훈</b>
      <nav class="lab-switch"><a href="a.html">A</a><a href="b.html" aria-current="page">B</a><a href="c.html">C</a><a href="d.html">D</a><a href="e.html">E</a><a href="f.html">F</a></nav>
    </header>
    <section class="hero" id="hero">
      <div class="glow"></div>
      <div class="layer dim" aria-hidden="true">
        <p class="name">이재훈</p>
        <p class="under">어려운 기술을 누구나 읽는 이야기로 옮깁니다.</p>
      </div>
      <div class="layer lit">
        <h1 class="name">이재훈</h1>
        <p class="under">어려운 <em>기술</em>을 누구나 읽는 <em>이야기</em>로 옮깁니다.</p>
      </div>
      <div class="bottom">
        <ul class="roles">
          <li><span>지금</span>노타 Technical Content Manager</li>
          <li><span>발행</span>『테크잇슈』</li>
          <li><span>저서</span>『샘 올트먼, 더 비전 2030』</li>
          <li><span>강연</span>기업·학교 AI 강연</li>
        </ul>
        <div class="actions"><a class="btn btn--primary" href="#">뉴스레터 구독</a><a class="btn btn--ghost" href="#">강연·협업 문의</a></div>
      </div>
    </section>
    <script>
      // A spotlight follows the pointer and reveals the lit layer. Without a pointer it drifts on its own.
      const hero = document.getElementById("hero");
      let tx = innerWidth * 0.3, ty = innerHeight * 0.45, cx = tx, cy = ty, last = 0;
      hero.addEventListener("pointermove", e => { tx = e.clientX; ty = e.clientY; last = performance.now(); });
      function frame(t) {
        if (t - last > 2500) { tx = innerWidth * (0.5 + Math.sin(t / 2200) * 0.32); ty = innerHeight * (0.42 + Math.cos(t / 1700) * 0.12); }
        cx += (tx - cx) * 0.12; cy += (ty - cy) * 0.12;
        hero.style.setProperty("--x", cx + "px"); hero.style.setProperty("--y", cy + "px");
        requestAnimationFrame(frame);
      }
      if (!matchMedia("(prefers-reduced-motion: reduce)").matches) requestAnimationFrame(frame);
      else hero.querySelector(".lit").style.cssText = "-webkit-mask-image:none;mask-image:none";
    </script>
  </body>
</html>
