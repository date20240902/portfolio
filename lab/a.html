<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>시안 A · 점으로 그려지는 이름</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
    <link rel="stylesheet" href="lab.css" />
    <style>
      .hero { position: relative; height: 100svh; min-height: 640px; overflow: hidden; }
      canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
      .copy { position: absolute; left: var(--gutter); right: var(--gutter); bottom: 9vh; display: flex; justify-content: space-between; align-items: flex-end; gap: 32px; flex-wrap: wrap; }
      .tagline { margin: 0 0 18px; font-size: clamp(20px, 2.4vw, 32px); font-weight: 600; letter-spacing: -0.02em; }
      .actions { display: flex; gap: 10px; }
      .hint { position: absolute; top: 50%; right: var(--gutter); transform: translateY(-50%) rotate(90deg); transform-origin: right center; font-size: 12px; letter-spacing: 0.2em; color: var(--muted); }
    </style>
  </head>
  <body>
    <header class="lab-nav">
      <b>이재훈</b>
      <nav class="lab-switch"><a href="a.html" aria-current="page">A</a><a href="b.html">B</a><a href="c.html">C</a><a href="d.html">D</a></nav>
    </header>
    <section class="hero">
      <canvas id="c" aria-hidden="true"></canvas>
      <h1 style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">이재훈</h1>
      <div class="copy">
        <div>
          <p class="tagline">어려운 기술을 누구나 읽는 이야기로 옮깁니다.</p>
          <ul class="roles">
            <li><span>지금</span>노타 Technical Content Manager</li>
            <li><span>발행</span>『테크잇슈』</li>
            <li><span>저서</span>『샘 올트먼, 더 비전 2030』</li>
            <li><span>강연</span>기업·학교 AI 강연</li>
          </ul>
        </div>
        <div class="actions"><a class="btn btn--primary" href="#">뉴스레터 구독</a><a class="btn btn--ghost" href="#">강연·협업 문의</a></div>
      </div>
      <p class="hint">MOVE YOUR CURSOR</p>
    </section>
    <script>
      // Particles gather into the name, scatter away from the pointer, then settle back.
      const c = document.getElementById("c"), x = c.getContext("2d");
      const still = matchMedia("(prefers-reduced-motion: reduce)").matches;
      let W, H, P = [], m = { x: -9999, y: -9999 };
      function build() {
        const dpr = Math.min(devicePixelRatio || 1, 2);
        W = c.clientWidth; H = c.clientHeight;
        c.width = W * dpr; c.height = H * dpr; x.setTransform(dpr, 0, 0, dpr, 0, 0);
        const o = document.createElement("canvas"), ox = o.getContext("2d");
        o.width = W; o.height = H;
        const size = Math.min(W * 0.3, H * 0.42);
        ox.font = `800 ${size}px Pretendard Variable, Pretendard, sans-serif`;
        ox.textAlign = "center"; ox.textBaseline = "middle"; ox.fillStyle = "#fff";
        ox.fillText("이재훈", W / 2, H * 0.4);
        const d = ox.getImageData(0, 0, W, H).data, gap = W < 700 ? 5 : 7, pts = [];
        for (let yy = 0; yy < H; yy += gap) for (let xx = 0; xx < W; xx += gap) if (d[(yy * W + xx) * 4 + 3] > 128) pts.push([xx, yy]);
        P = pts.map(([tx, ty]) => ({ tx, ty, x: Math.random() * W, y: Math.random() * H, vx: 0, vy: 0, blue: Math.random() < 0.18 }));
      }
      addEventListener("pointermove", e => { m.x = e.clientX; m.y = e.clientY; });
      addEventListener("pointerleave", () => { m.x = m.y = -9999; });
      function frame() {
        x.clearRect(0, 0, W, H);
        for (const p of P) {
          const dx = p.x - m.x, dy = p.y - m.y, d2 = dx * dx + dy * dy;
          if (d2 < 9000) { const f = (9000 - d2) / 9000 * 6; const d = Math.sqrt(d2) || 1; p.vx += dx / d * f; p.vy += dy / d * f; }
          p.vx += (p.tx - p.x) * 0.012; p.vy += (p.ty - p.y) * 0.012;
          p.vx *= 0.86; p.vy *= 0.86; p.x += p.vx; p.y += p.vy;
          const speed = Math.min(1, Math.hypot(p.vx, p.vy) / 6);
          x.fillStyle = p.blue || speed > 0.25 ? `rgba(110,150,255,${0.6 + speed * 0.4})` : "rgba(242,242,242,0.85)";
          x.fillRect(p.x, p.y, 2, 2);
        }
        if (!still) requestAnimationFrame(frame);
      }
      document.fonts.ready.then(() => { build(); if (still) P.forEach(p => { p.x = p.tx; p.y = p.ty; }); frame(); });
      addEventListener("resize", () => { build(); if (still) frame(); });
    </script>
  </body>
</html>
