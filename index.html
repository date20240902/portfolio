          <div class="numbers__item">
            <dt>칼럼과 기고</dt>
            <dd>300<small>+</small></dd>
          </div>
          <div class="numbers__item">
            <dt>함께한 브랜드·매체</dt>
            <dd>10<small>곳</small></dd>
          </div>
